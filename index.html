<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOVE vs MONEY LIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050509;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 25px;
    }

    .title {
      text-align: center;
      font-size: clamp(28px, 6vw, 60px);
      font-weight: 900;
      letter-spacing: 2px;
    }

    .status {
      text-align: center;
      font-size: 16px;
      opacity: 0.8;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .side {
      min-height: 300px;
      border-radius: 30px;
      padding: 30px 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
      border: 2px solid rgba(255,255,255,.2);
    }

    .love {
      background: linear-gradient(160deg, #35101c, #12050b);
    }

    .money {
      background: linear-gradient(160deg, #332a05, #100e03);
    }

    .emoji {
      font-size: clamp(55px, 12vw, 100px);
    }

    .name {
      font-size: clamp(25px, 6vw, 50px);
      font-weight: 900;
    }

    .score {
      font-size: clamp(60px, 14vw, 120px);
      font-weight: 900;
    }

    .bar {
      height: 18px;
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      transition: width .3s ease;
    }

    .love .fill {
      background: #ff3d68;
    }

    .money .fill {
      background: #ffd43b;
    }

    .round {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .event {
      text-align: center;
      min-height: 30px;
      font-size: 18px;
      opacity: .9;
    }

    @media (max-width: 600px) {
      .game {
        padding: 15px;
      }

      .side {
        min-height: 240px;
        padding: 15px 8px;
      }
    }
  </style>
</head>

<body>

  <main class="game">

    <div class="title">LOVE ❤️ vs MONEY 💰</div>

    <div class="status" id="status">
      Connecting to LIVE bridge...
    </div>

    <div class="teams">

      <section class="side love">
        <div class="emoji">❤️</div>
        <div class="name">LOVE</div>
        <div class="score" id="loveScore">0</div>

        <div class="bar">
          <div class="fill" id="loveBar"></div>
        </div>
      </section>

      <section class="side money">
        <div class="emoji">💰</div>
        <div class="name">MONEY</div>
        <div class="score" id="moneyScore">0</div>

        <div class="bar">
          <div class="fill" id="moneyBar"></div>
        </div>
      </section>

    </div>

    <div class="round" id="round">
      ROUND 1 • FIRST TO 100
    </div>

    <div class="event" id="event">
      Waiting for LIVE events...
    </div>

  </main>

  <script>
    let love = 0;
    let money = 0;

    const loveScore = document.getElementById("loveScore");
    const moneyScore = document.getElementById("moneyScore");
    const loveBar = document.getElementById("loveBar");
    const moneyBar = document.getElementById("moneyBar");
    const status = document.getElementById("status");
    const eventBox = document.getElementById("event");

    function updateScreen() {
      loveScore.textContent = love;
      moneyScore.textContent = money;

      loveBar.style.width = Math.min(love, 100) + "%";
      moneyBar.style.width = Math.min(money, 100) + "%";
    }

    function showEvent(text) {
      eventBox.textContent = text;

      setTimeout(() => {
        eventBox.textContent = "Waiting for LIVE events...";
      }, 3000);
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(protocol + "//" + location.host);

      socket.onopen = () => {
        status.textContent = "🟢 LIVE BRIDGE ONLINE";
      };

      socket.onclose = () => {
        status.textContent = "🔴 Bridge disconnected — reconnecting...";
        setTimeout(connect, 3000);
      };

      socket.onerror = () => {
        status.textContent = "⚠️ Connection error";
      };

      socket.onmessage = (message) => {
        try {
          const data = JSON.parse(message.data);

          console.log("LIVE EVENT:", data);

          /*
            The TikTok event adapter will feed events here.
            We will connect the exact event types in the next step.
          */

          if (data.love !== undefined) {
            love = Number(data.love);
          }

          if (data.money !== undefined) {
            money = Number(data.money);
          }

          if (data.message) {
            showEvent(data.message);
          }

          updateScreen();

        } catch (error) {
          console.log("Received:", message.data);
        }
      };
    }

    updateScreen();
    connect();
  </script>

</body>
  </html>
